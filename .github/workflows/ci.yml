name: CI - Build & Push Docker Image

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Zaloguj się do Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Zbuduj i wypchnij obraz Docker
        uses: docker/build-push-action@v6
        with:
          context: ./zad10Chmura
          push: true
          tags: tyrpik/shopping-list:latest

      - name: SonarCloud Scan
        id: sonar
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./zad10Chmura

      - name: Wyślij powiadomienie email (sukces)
        if: success()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "SonarCloud – analiza zakończona sukcesem - ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Cześć Maria!

            Analiza SonarCloud zakończyła się sukcesem.

            Repozytorium: ${{ github.repository }}
            Gałąź: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            Wyniki Sonara: https://sonarcloud.io/project/overview?id=tyrpik_EBiznes

            Obraz Docker dostępny na: https://hub.docker.com/r/tyrpik/shopping-list

      - name: Wyślij powiadomienie email (błąd)
        if: failure()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "SonarCloud – analiza FAILED - ${{ github.repository }}"
          to: maria.j.tyrpa@student.uj.edu.pl
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Cześć Maria!

            Analiza SonarCloud NIE powiodła się.

            Repozytorium: ${{ github.repository }}
            Gałąź: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}

            Sprawdź logi: https://github.com/${{ github.repository }}/actions
            Wyniki Sonara: https://sonarcloud.io/project/overview?id=TWOJ_PROJECT_KEY